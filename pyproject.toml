[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "unstop-mcp"
version = "1.5.0"
description = "Authenticated Model Context Protocol server for Unstop (hackathons, competitions, jobs, internships)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0,<3",
    "httpx>=0.27,<1",
    "cryptography>=42",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-github-actions-annotate-failures>=0.2",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
unstop-mcp = "unstop_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unstop_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: hits the real unstop.com public API (deselect with -m 'not live')"]

[tool.ruff]
line-length = 128
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "E501"]
"src/unstop_mcp/weblogin.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
