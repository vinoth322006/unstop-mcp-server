name: release
# Push a tag like v1.2.0 to build and publish every install option.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests && mypy src && pytest -m "not live" -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: pip install . build pyinstaller==6.22.3
      - name: Build release files
        # On failure the last lines of output become an annotation (readable without signing in).
        shell: bash
        run: |
          set -o pipefail
          if ! python packaging/build_release.py 2>&1 | tee build.log; then
            msg=$(grep -v '^  \$ ' build.log | tail -25 | sed 's/%/%25/g' | tr '\r\n' '  ' | cut -c1-4000)
            echo "::error title=release build failed::$msg"; exit 1
          fi
      - uses: actions/upload-artifact@v7
        with: { name: windows, path: dist/release/* }

  publish:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: windows, path: dist }
      - name: Release notes from CHANGELOG.md
        run: python3 packaging/release_notes.py "${GITHUB_REF_NAME}" > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: notes.md

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/unstop-mcp:latest
            ghcr.io/${{ github.repository_owner }}/unstop-mcp:${{ github.ref_name }}
