name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests packaging
      - run: mypy src
      - run: pytest -m "not live" -q
      - name: CLI smoke test
        run: |
          unstop-mcp --version
          unstop-mcp --help

  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell installers parse and use LF line endings
        run: |
          for f in get.sh install.sh; do
            sh -n "$f"
            if grep -q $'\r' "$f"; then echo "$f has CRLF line endings"; exit 1; fi
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from the built wheel into a clean venv
        run: |
          pip install build
          python -m build --wheel --outdir dist
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/unstop-mcp --version

  live-smoke:
    # Hits the real public Unstop API; informational only.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -m live -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t unstop-mcp:ci .
      - name: Container starts and reports healthy
        run: |
          docker run -d --name t -p 8000:8000 -e UNSTOP_MCP_SECRET_KEY=ci-test-secret unstop-mcp:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/healthz && exit 0; sleep 1; done
          docker logs t; exit 1
