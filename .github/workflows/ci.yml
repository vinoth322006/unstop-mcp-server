name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests packaging
      - run: mypy src
      - run: pytest -m "not live" -q -rf  # failures also appear as annotations on the run page
      - name: CLI smoke test
        run: |
          unstop-mcp --version
          unstop-mcp --help

  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell installers parse and use LF line endings
        run: |
          for f in get.sh install.sh; do
            sh -n "$f"
            if grep -q $'\r' "$f"; then echo "$f has CRLF line endings"; exit 1; fi
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from the built wheel into a clean venv
        run: |
          pip install build
          python -m build --wheel --outdir dist
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/unstop-mcp --version

  release-build:
    # Builds the .exe and .mcpb exactly as the release workflow does, so a broken build shows up before tagging.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install . build pyinstaller==6.22.3
      - name: Build release files
        shell: bash
        run: |
          set -o pipefail
          if ! python packaging/build_release.py 2>&1 | tee build.log; then
            msg=$(grep -v '^  \$ ' build.log | tail -25 | sed 's/%/%25/g' | tr '\r\n' '  ' | cut -c1-4000)
            echo "::error title=release build failed::$msg"; exit 1
          fi

  live-smoke:
    # Hits the real public Unstop API; informational only.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -m live -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t unstop-mcp:ci .
      - name: Container starts and reports healthy
        # Docker picks a free host port; failures are written as annotations (readable without signing in).
        run: |
          if ! out=$(docker run -d --name unstop-ci -p 127.0.0.1::8000 -e UNSTOP_MCP_SECRET_KEY=ci-test-secret unstop-mcp:ci 2>&1); then
            echo "::error title=docker run failed::${out//$'\n'/ }"; exit 1
          fi
          port=$(docker port unstop-ci 8000/tcp | head -1 | sed 's/.*://')
          for i in $(seq 1 30); do curl -fs "http://127.0.0.1:$port/healthz" && exit 0; sleep 1; done
          logs=$(docker logs unstop-ci 2>&1 | tail -15)
          echo "::error title=container never became healthy::${logs//$'\n'/ }"; exit 1
